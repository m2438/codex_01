<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">日産自動車 CRE営業ターゲット 16:9 BIダッシュボード</title>
  <desc id="desc">日産自動車のCRE営業機会を、工場再編、固定資産売却、財務圧力、注目資産、提案テーマで可視化した日本語の16:9ダッシュボード。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06101d"/><stop offset="0.52" stop-color="#0a1628"/><stop offset="1" stop-color="#101827"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14243e" stop-opacity=".96"/><stop offset="1" stop-color="#0b1729" stop-opacity=".96"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#28d4ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#28d4ff"/><stop offset="1" stop-color="#43e6a0"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5c7a"/><stop offset="1" stop-color="#ffc857"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".34"/></filter>
    <style>
      .font{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic','Noto Sans JP','Segoe UI',sans-serif}.muted{fill:#91a2b8}.text{fill:#e6edf7}.cyanText{fill:#28d4ff}.greenText{fill:#43e6a0}.amber{fill:#ffc857}.red{fill:#ff5c7a}.card{fill:url(#panel);stroke:rgba(148,163,184,.24);stroke-width:1.1;filter:url(#shadow)}.label{font-size:15px;font-weight:800;letter-spacing:.10em}.small{font-size:17px}.body{font-size:20px}.h1{font-size:48px;font-weight:900;letter-spacing:-1.6px}.h2{font-size:27px;font-weight:850;letter-spacing:-.5px}.h3{font-size:22px;font-weight:850}.metric{font-size:34px;font-weight:900;letter-spacing:-1px}
    </style>
  </defs>
  <rect width="1500" height="900" fill="url(#bg)"/>
  <circle cx="100" cy="90" r="250" fill="#4f8cff" opacity=".20"/><circle cx="1370" cy="50" r="290" fill="#28d4ff" opacity=".12"/><circle cx="1220" cy="760" r="330" fill="#43e6a0" opacity=".08"/>

  <text x="50" y="58" class="font label cyanText">NISSAN MOTOR CO. / CORPORATE REAL ESTATE</text>
  <text x="50" y="112" class="font h1 text">日産自動車 CRE営業ターゲットBI</text>
  <text x="50" y="150" class="font body muted">基準日：2026-05-12 ・ 公開資料、Re:Nissan、財務・資産シグナルに基づく営業判断用ダッシュボード</text>
  <rect x="1160" y="40" width="288" height="136" rx="28" class="card"/>
  <circle cx="1230" cy="108" r="44" fill="none" stroke="rgba(255,255,255,.11)" stroke-width="13"/><circle cx="1230" cy="108" r="44" fill="none" stroke="#43e6a0" stroke-width="13" stroke-linecap="round" pathLength="100" stroke-dasharray="92 8" transform="rotate(-90 1230 108)"/>
  <text x="1295" y="92" class="font small muted">総合評価</text><text x="1295" y="132" class="font metric text">92 / 100</text><text x="1295" y="158" class="font small greenText">最優先ターゲット</text>

  <g id="kpis">
    <rect x="50" y="195" width="315" height="120" rx="22" class="card"/><text x="74" y="234" class="font small muted">案件発生確度</text><text x="74" y="276" class="font metric text">24 / 25</text><rect x="74" y="292" width="245" height="10" rx="5" fill="rgba(255,255,255,.10)"/><rect x="74" y="292" width="235" height="10" rx="5" fill="url(#hot)"/><text x="74" y="310" class="font small muted">車両生産工場 17→10</text>
    <rect x="390" y="195" width="315" height="120" rx="22" class="card"/><text x="414" y="234" class="font small muted">案件規模</text><text x="414" y="276" class="font metric text">20 / 20</text><rect x="414" y="292" width="245" height="10" rx="5" fill="rgba(255,255,255,.10)"/><rect x="414" y="292" width="245" height="10" rx="5" fill="url(#hot)"/><text x="414" y="310" class="font small muted">工場・物流・研究開発・本社</text>
    <rect x="730" y="195" width="315" height="120" rx="22" class="card"/><text x="754" y="234" class="font small muted">経営課題との一致</text><text x="754" y="276" class="font metric text">19 / 20</text><rect x="754" y="292" width="245" height="10" rx="5" fill="rgba(255,255,255,.10)"/><rect x="754" y="292" width="233" height="10" rx="5" fill="url(#green)"/><text x="754" y="310" class="font small muted">FCF赤字・固定費削減</text>
    <rect x="1070" y="195" width="315" height="120" rx="22" class="card"/><text x="1094" y="234" class="font small muted">タイミング</text><text x="1094" y="276" class="font metric text">9 / 10</text><rect x="1094" y="292" width="245" height="10" rx="5" fill="rgba(255,255,255,.10)"/><rect x="1094" y="292" width="221" height="10" rx="5" fill="url(#green)"/><text x="1094" y="310" class="font small muted">2027年度まで案件集中</text>
  </g>

  <rect x="50" y="350" width="650" height="365" rx="28" class="card"/>
  <text x="78" y="392" class="font label cyanText">SIGNAL HEATMAP</text><text x="78" y="428" class="font h2 text">CREシグナル強度</text>
  <g class="font">
    <rect x="78" y="456" width="594" height="55" rx="15" fill="#171f34" stroke="rgba(255,92,122,.48)"/><rect x="96" y="471" width="7" height="25" rx="4" fill="#ff5c7a"/><text x="120" y="480" class="h3 text">工場統合・生産能力削減</text><text x="120" y="501" class="small muted">17→10工場、跡地売却、移転PM、自治体調整</text><text x="630" y="483" text-anchor="end" class="small red">非常に強い</text>
    <rect x="78" y="525" width="594" height="55" rx="15" fill="#171f34" stroke="rgba(255,92,122,.48)"/><rect x="96" y="540" width="7" height="25" rx="4" fill="#ff5c7a"/><text x="120" y="549" class="h3 text">固定資産売却の加速</text><text x="120" y="570" class="small muted">売却収入1,767億円、売却益1,191億円</text><text x="630" y="552" text-anchor="end" class="small red">非常に強い</text>
    <rect x="78" y="594" width="594" height="55" rx="15" fill="#171f34" stroke="rgba(255,200,87,.44)"/><rect x="96" y="609" width="7" height="25" rx="4" fill="#ffc857"/><text x="120" y="618" class="h3 text">遊休・処分予定資産</text><text x="120" y="639" class="small muted">遊休27件、売却24件、処分予定11件</text><text x="630" y="621" text-anchor="end" class="small amber">強い</text>
    <rect x="78" y="663" width="594" height="36" rx="13" fill="#171f34" stroke="rgba(255,200,87,.34)"/><text x="120" y="687" class="h3 text">資本効率化圧力</text><text x="630" y="687" text-anchor="end" class="small amber">強い</text>
  </g>

  <rect x="730" y="350" width="655" height="365" rx="28" class="card"/>
  <text x="758" y="392" class="font label cyanText">FINANCIAL SNAPSHOT</text><text x="758" y="428" class="font h2 text">財務・キャッシュ・資産売却</text>
  <g class="font">
    <text x="758" y="476" class="small muted">自動車事業FCF</text><text x="1255" y="476" text-anchor="end" class="h3 red">-6,914億円</text><rect x="758" y="492" width="520" height="14" rx="7" fill="rgba(255,255,255,.10)"/><rect x="758" y="492" width="520" height="14" rx="7" fill="url(#hot)"/>
    <text x="758" y="540" class="small muted">固定資産売却収入</text><text x="1255" y="540" text-anchor="end" class="h3 greenText">1,767億円</text><rect x="758" y="556" width="520" height="14" rx="7" fill="rgba(255,255,255,.10)"/><rect x="758" y="556" width="133" height="14" rx="7" fill="url(#green)"/>
    <text x="758" y="604" class="small muted">固定資産売却益</text><text x="1255" y="604" text-anchor="end" class="h3 greenText">1,191億円</text><rect x="758" y="620" width="520" height="14" rx="7" fill="rgba(255,255,255,.10)"/><rect x="758" y="620" width="90" height="14" rx="7" fill="url(#green)"/>
    <rect x="758" y="658" width="145" height="42" rx="13" fill="rgba(255,255,255,.05)"/><text x="774" y="676" class="small muted">土地</text><text x="774" y="695" class="h3 text">5,668億円</text>
    <rect x="920" y="658" width="190" height="42" rx="13" fill="rgba(255,255,255,.05)"/><text x="936" y="676" class="small muted">長期社債</text><text x="936" y="695" class="h3 text">2兆6,711億円</text>
    <rect x="1127" y="658" width="190" height="42" rx="13" fill="rgba(255,255,255,.05)"/><text x="1143" y="676" class="small muted">減損損失</text><text x="1143" y="695" class="h3 text">806億円</text>
  </g>

  <g class="font">
    <rect x="50" y="750" width="420" height="92" rx="23" fill="#171f34" stroke="rgba(255,92,122,.50)" filter="url(#shadow)"/><text x="78" y="782" class="label red">最重要資産</text><text x="78" y="812" class="h2 text">追浜工場</text><text x="78" y="834" class="small muted">1,844,577㎡・売却/再活用/再開発</text>
    <rect x="500" y="750" width="420" height="92" rx="23" class="card"/><text x="528" y="782" class="label cyanText">受け皿拠点</text><text x="528" y="812" class="h2 text">日産自動車九州</text><text x="528" y="834" class="small muted">2,355,196㎡・受入改修/物流再設計</text>
    <rect x="950" y="750" width="435" height="92" rx="23" fill="url(#cyan)" opacity=".94" filter="url(#shadow)"/><text x="978" y="782" class="label" fill="#06101d">初回提案</text><text x="978" y="812" class="h2" fill="#06101d">CRE戦略PMO</text><text x="978" y="834" class="small" fill="#06101d">資産売却・跡地構想・環境DD・移転PM</text>
  </g>
</svg>
