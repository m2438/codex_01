<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=./index.html" />
    <title>ダッシュボードを開く</title>
    <style>
      :root { color-scheme: dark; --bg:#07111f; --panel:rgba(15,30,52,.86); --text:#eef6ff; --muted:#9fb2c9; --cyan:#28d4ff; --green:#55f2a7; --line:rgba(255,255,255,.16); }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at 20% 10%,rgba(40,212,255,.28),transparent 34%),radial-gradient(circle at 90% 90%,rgba(85,242,167,.18),transparent 30%),var(--bg); }
      main { width:min(720px,100%); padding:30px; border:1px solid var(--line); border-radius:28px; background:var(--panel); box-shadow:0 28px 90px rgba(0,0,0,.42); text-align:center; }
      h1 { margin:0 0 12px; font-size:clamp(2rem,8vw,3.8rem); line-height:1; letter-spacing:-.06em; }
      p { color:var(--muted); line-height:1.8; }
      a { display:inline-flex; align-items:center; justify-content:center; min-height:48px; margin-top:16px; padding:0 18px; border-radius:14px; color:#06101d; background:linear-gradient(135deg,var(--cyan),var(--green)); font-weight:900; text-decoration:none; }
    </style>
  </head>
  <body>
    <main>
      <h1>BIダッシュボードを開いています</h1>
      <p>自動で移動しない場合は、下のボタンを押してください。</p>
      <a href="./index.html">ダッシュボードポータルを開く</a>
    </main>
  </body>
</html>
